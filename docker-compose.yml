services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devpulse
      POSTGRES_USER: devpulse
      POSTGRES_PASSWORD: devpulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpulse -d devpulse"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      API_KEY: ${API_KEY:-dev-only-change-me}
      DATABASE_URL: postgresql+psycopg://devpulse:devpulse@db:5432/devpulse
      SCHEDULER_ENABLED: "true"
      CHECK_INTERVAL_SECONDS: 60
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
